[project]
name = "wquantiles"
version = "0.7"
description = "Weighted quantiles, including weighted median, based on numpy"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jose Sabater", email = "jsm@jsabater.info" },
]
keywords = ["statistics", "quantile", "percentile", "median", "weighted", "numpy"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# numpy 1.18 has no wheels for Python 3.9, so it is not reachable from any
# supported interpreter; 1.19 is the oldest combination CI can actually build.
dependencies = [
    "numpy>=1.19",
]

[project.urls]
Homepage = "https://github.com/nudomarinero/wquantiles"
Repository = "https://github.com/nudomarinero/wquantiles"
Changelog = "https://github.com/nudomarinero/wquantiles/blob/master/CHANGES.md"

# Everything needed to run the test suite, in one place. CI installs the
# package with this extra rather than listing test dependencies of its own,
# so the two cannot drift apart.
[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "hypothesis>=6.100",
]

[dependency-groups]
dev = [
    "wquantiles[test]",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["wquantiles", "weighted"]
# Ship the test suite in the sdist so downstream packagers can run it.
source-include = ["test/**", "CHANGES.md"]
